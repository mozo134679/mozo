<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — mɔzɔ</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --walnut: #3E2C23;
      --orange: #C2592D;
      --cream: #F6EEE0;
      --cream-dark: #EDE1CC;
      --text: #4A3728;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--walnut);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 56px;
      background: rgba(246,238,224,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(62,44,35,.08);
    }
    .nav-logo { height: 26px; }
    nav a {
      font-size: 0.875rem;
      color: var(--walnut);
      text-decoration: none;
      opacity: .65;
    }
    nav a:hover { opacity: 1; }

    /* MAIN */
    main {
      flex: 1;
      padding: 140px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-header {
      text-align: center;
      margin-bottom: 52px;
      max-width: 560px;
    }
    .page-eyebrow {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 14px;
    }
    .page-title {
      font-family: 'Chillax', sans-serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      color: var(--walnut);
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .page-sub {
      font-size: 1rem;
      font-weight: 300;
      color: var(--text);
      line-height: 1.7;
      opacity: .8;
    }

    /* FORM CARD */
    .form-card {
      background: white;
      border-radius: 24px;
      padding: 48px 52px;
      width: 100%;
      max-width: 600px;
      border: 1px solid rgba(62,44,35,.07);
      box-shadow: 0 8px 40px rgba(62,44,35,.07);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 24px;
    }
    .form-group:last-of-type { margin-bottom: 32px; }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--walnut);
    }
    .required { color: var(--orange); margin-left: 2px; }

    input, select, textarea {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--walnut);
      background: var(--cream);
      border: 1.5px solid rgba(62,44,35,.15);
      border-radius: 10px;
      padding: 12px 16px;
      width: 100%;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
      -webkit-appearance: none;
    }
    input::placeholder, textarea::placeholder { color: rgba(62,44,35,.35); font-weight: 300; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(194,89,45,.1);
    }
    textarea {
      resize: vertical;
      min-height: 140px;
    }
    select { cursor: pointer; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .btn-submit {
      width: 100%;
      background: var(--orange);
      color: var(--cream);
      border: none;
      padding: 16px;
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .btn-submit:hover { background: #a8481f; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }

    /* SUCCESS STATE */
    .success-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      padding: 20px 0;
    }
    .success-icon {
      width: 64px; height: 64px;
      background: rgba(194,89,45,.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }
    .success-msg h3 {
      font-family: 'Chillax', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--walnut);
    }
    .success-msg p {
      font-size: 0.95rem;
      color: var(--text);
      opacity: .8;
      font-weight: 300;
      line-height: 1.6;
    }

    /* FOOTER */
    footer {
      background: var(--walnut);
      border-top: 1px solid rgba(246,238,224,.08);
      padding: 40px 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .footer-logo { height: 22px; filter: brightness(10); opacity: .7; }
    footer p, footer a {
      font-size: 0.8rem;
      color: rgba(246,238,224,.45);
      text-decoration: none;
    }
    footer a:hover { color: var(--cream); }
    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }

    @media (max-width: 768px) {
      nav { padding: 16px 20px; }
      .form-card { padding: 32px 24px; }
      .form-row { grid-template-columns: 1fr; }
      footer { padding: 32px 20px; flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

  <main>
    <div class="page-header">
      <div class="page-eyebrow">Support</div>
      <h1 class="page-title">On est là pour toi</h1>
      <p class="page-sub">Un bug, une question, une suggestion ? Envoie-nous un message, on te répond dans les plus brefs délais.</p>
    </div>

    <div class="form-card">
      <form id="supportForm">

        <div class="form-row">
          <div class="form-group">
            <label for="prenom">Prénom <span class="required">*</span></label>
            <input type="text" id="prenom" name="prenom" placeholder="Ton prénom" required />
          </div>
          <div class="form-group">
            <label for="nom">Nom <span class="required">*</span></label>
            <input type="text" id="nom" name="nom" placeholder="Ton nom" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="ton@email.com" required />
        </div>

        <div class="form-group">
          <label for="sujet">Sujet <span class="required">*</span></label>
          <select id="sujet" name="sujet" required>
            <option value="" disabled selected>Choisir un sujet</option>
            <option value="bug">Signaler un bug</option>
            <option value="question">Poser une question</option>
            <option value="suggestion">Faire une suggestion</option>
            <option value="compte">Problème de compte</option>
            <option value="autre">Autre</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message <span class="required">*</span></label>
          <textarea id="message" name="message" placeholder="Décris ton problème ou ta suggestion en détail..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Envoyer le message</button>
      </form>

      <div class="success-msg" id="successMsg">
        <div class="success-icon">✓</div>
        <h3>Message envoyé !</h3>
        <p>Merci pour ton retour. On te répond par email dans les plus brefs délais.</p>
      </div>
    </div>

  <script>
    document.getElementById('supportForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('.btn-submit');
      btn.textContent = 'Envoi en cours...';
      btn.disabled = true;

      const data = {
        prenom: document.getElementById('prenom').value,
        nom: document.getElementById('nom').value,
        email: document.getElementById('email').value,
        sujet: document.getElementById('sujet').value,
        message: document.getElementById('message').value,
      };

      // Send to Supabase Edge Function (to be created) or mailto fallback
      try {
        const res = await fetch('https://bbdcfqayjvfcllhkcvxi.supabase.co/functions/v1/support-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (!res.ok) throw new Error();
      } catch {
        // Fallback : open mailto
        const subject = encodeURIComponent(`[Support mɔzɔ] ${data.sujet} — ${data.prenom} ${data.nom}`);
        const body = encodeURIComponent(`Prénom : ${data.prenom}\nNom : ${data.nom}\nEmail : ${data.email}\nSujet : ${data.sujet}\n\n${data.message}`);
        window.location.href = `mailto:hello@mozo.coach?subject=${subject}&body=${body}`;
      }

      document.getElementById('supportForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'flex';
    });
  </script>
